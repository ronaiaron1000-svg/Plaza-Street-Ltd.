<section>

<h1 class="title">
🚀 Development Progress
</h1>


<div class="progress-box">

<h2 id="phase-title">
Phase 1 - Community Setup
</h2>

<p id="phase-text">
Currently building the official Plaza Street Ltd. Discord server,
roles, channels and community systems.
</p>


<input 
type="range" 
min="1" 
max="3" 
value="1" 
id="progressSlider"
>


<div class="phases">

<span>🏢 Phase 1</span>
<span>🏗️ Phase 2</span>
<span>🏬 Phase 3</span>

</div>

</div>

</section>


<script>

const slider = document.getElementById("progressSlider");

const title = document.getElementById("phase-title");
const text = document.getElementById("phase-text");


slider.oninput = function(){

if(this.value == 1){

title.innerHTML =
"Phase 1 - Community Setup 🏢";

text.innerHTML =
"Currently building the official Discord server, roles, channels and community systems.";

}


if(this.value == 2){

title.innerHTML =
"Phase 2 - Game Development 🏗️";

text.innerHTML =
"Creating the first plaza buildings, basic systems and the foundation of the Roblox experience.";

}



if(this.value == 3){

title.innerHTML =
"Phase 3 - Community Creation 🏬";

text.innerHTML =
"Opening applications where players can create their own stores and bring ideas into the game.";

}


}

</script>
